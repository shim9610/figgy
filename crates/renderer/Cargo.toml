[package]
name = "figgy-renderer"
version = "0.19.0-beta.2"
edition = "2024"
rust-version = "1.99"
description = "Native Rust chart renderer combining wgpu data rendering with CPU-rasterized axes and text."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shim9610/figgy"
readme = "README.md"
keywords = ["plotting", "charts", "wgpu", "visualization"]
categories = ["graphics", "rendering", "visualization"]
# Ship reproducible code/examples/tests, not gallery captures or unsupported hosts.
include = [
    "/Cargo.toml", "/Cargo.lock", "/LICENSE-*", "/*.md",
    "/src/**", "/fonts/**", "/examples/**", "/tests/**",
]

# Registry package identity changes; existing Rust import paths do not.
[lib]
name = "renderer"

[package.metadata.docs.rs]
features = ["serde"]
default-target = "x86_64-unknown-linux-gnu"
targets = ["wasm32-unknown-unknown"]

[dependencies]
model = { package = "figgy-model", path = "../model", version = "=0.13.0-beta.2", default-features = false }

bytemuck = { version = "1.19", features = ["derive"] }
# Atomic ownership handoff for GPU resources awaiting submission/completion.
concurrent-queue = "2.5"
# Awaitable buffer-map signal for the async export path (works on wasm too).
futures-channel = "0.3"
png = "0.18"
# Deflates the PDF export's content and image streams (#48); already in the
# graph through png.
flate2 = "1"
wgpu = "30"

# Pure-Rust CPU raster stack (axis chrome + text) — compiles on every target
# including wasm32-unknown-unknown.
fontdb = "0.24"
swash = "0.2"
tiny-skia = "0.12"
# The OpenType MATH table (constants, italic corrections, accent attachments,
# glyph variants and assemblies) and the GSUB `ssty` script alternates of the
# math layout (#45). swash pins read-fonts 0.41, which has no MATH table;
# this is the release that does. Unify with its version when it moves.
read-fonts = { version = "0.47", default-features = false, features = ["std"] }
# Lock-free reads of the registered-font snapshot; registration publishes a
# successor under its own mutex (#160).
arc-swap = "1.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
# The crate's own tests enable `cpu-twin`, so the CPU picker in
# `tests/support/cpu_twin.rs` compiles for `cargo test` only.
figgy-renderer = { path = ".", features = ["cpu-twin"] }
winit = "0.30.13"
serde_json = "1"
# The cache-key mutation tests walk serialized documents through a recording
# deserializer (`src/renderer/config_mutation.rs`).
serde = { version = "1", features = ["derive"] }

[features]
default = ["helpers"]
# Host conveniences re-exported from the model (#266): `Default` on the
# document types and `renderer::default`. The library itself builds without it.
helpers = ["model/helpers"]
serde = ["model/serde"]
# Test support: the CPU twins of the shader coverage (`renderer::pick::cpu_twin`).
cpu-twin = []

[[example]]
name = "winit_simple"
path = "examples/winit_simple.rs"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# `cfg(loom)` is set only by `tools/loom-poller`, which model-checks the
# poll thread's protocol in `src/gpu_poller.rs` (#160).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
