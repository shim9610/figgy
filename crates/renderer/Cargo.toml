[package]
name = "figgy-renderer"
version = "0.13.0"
edition = "2024"
rust-version = "1.99"
description = "Native Rust chart renderer combining wgpu data rendering with CPU-rasterized axes and text."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shim9610/figgy"
readme = "README.md"
keywords = ["plotting", "charts", "wgpu", "visualization"]
categories = ["graphics", "rendering", "visualization"]

# Registry package identity changes; existing Rust import paths do not.
[lib]
name = "renderer"

[dependencies]
model = { package = "figgy-model", path = "../model", version = "0.8.0" }

bytemuck = { version = "1.19", features = ["derive"] }
# Awaitable buffer-map signal for the async export path (works on wasm too).
futures-channel = "0.3"
png = "0.18"
wgpu = "30"

# Pure-Rust CPU raster stack (axis chrome + text) — compiles on every target
# including wasm32-unknown-unknown.
fontdb = "0.24"
swash = "0.2"
tiny-skia = "0.12"

# Blocking executor for the sync convenience wrappers — never on wasm, where
# blocking the single thread would deadlock; use the *_async variants there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0"
eframe = { version = "0.36", optional = true, default-features = false, features = ["wgpu", "x11", "wayland"] }
egui = { version = "0.36", optional = true }
egui-wgpu = { version = "0.36", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }

# iced 0.14 still requires wgpu 27. Its integration source stays under
# unsupported/; re-wire it when iced ships a wgpu 30 release.
# iced = { version = "0.14", optional = true, features = ["wgpu"] }
# iced_wgpu = { version = "0.14", optional = true }

[dev-dependencies]
winit = "0.30.13"
serde_json = "1"

[features]
serde = ["model/serde"]
egui_demo = ["dep:eframe", "dep:egui", "dep:egui-wgpu"]

[[example]]
name = "winit_simple"
path = "examples/winit_simple.rs"

[[example]]
name = "constellation_lab"
path = "examples/constellation_lab.rs"
required-features = ["egui_demo"]

[[example]]
name = "egui_embed"
path = "examples/egui_embed.rs"
required-features = ["egui_demo"]

[[example]]
name = "streaming_capacity_demo"
path = "examples/streaming_capacity_demo.rs"
required-features = ["egui_demo"]

[[example]]
name = "ssot_lab"
path = "examples/ssot_lab.rs"
required-features = ["egui_demo"]

[[example]]
name = "radial_editor"
path = "examples/radial_editor.rs"
required-features = ["egui_demo"]

[[example]]
name = "categorical_editor"
path = "examples/categorical_editor.rs"
required-features = ["egui_demo"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[example]]
name = "boxplot_editor"
path = "examples/boxplot_editor.rs"
required-features = ["egui_demo"]
