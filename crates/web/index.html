<!DOCTYPE html>
<!--
  figgy web demo - reference wiring for the wasm artifact in ./pkg/.

  Serve over HTTP (wasm modules don't load from file://):
      cd crates/web && npx serve .        # or: python -m http.server
  then open the printed URL. Requires a WebGPU browser
  (Chrome/Edge stable, Firefox 141+, Safari 26+).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>figgy - wasm demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    #toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    #chart-wrap { width: min(960px, 95vw); height: 540px; border: 1px solid #ddd; }
    figgy-chart { width: 100%; height: 100%; display: block; }
    #swatches span { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 2px; vertical-align: middle; }
  </style>
</head>
<body>
  <div id="toolbar">
    <label>Axis:
      <select id="axis-preset">
        <option value="BoxedInward">Boxed · inward ticks</option>
        <option value="BoxedOutward">Boxed · outward ticks</option>
        <option value="OpenOutward">Open · outward ticks</option>
        <option value="OpenInward">Open · inward ticks</option>
        <option value="Minimal">Minimal</option>
      </select>
    </label>
    <label>Colors:
      <select id="color-cycle">
        <option value="Classic">Classic</option>
        <option value="Vivid">Vivid</option>
        <option value="Balanced">Balanced</option>
        <option value="ColorblindSafe">Colorblind-safe</option>
        <option value="Monochrome">Monochrome</option>
      </select>
    </label>
    <span id="swatches"></span>
    <label>Bin count: <input id="bins" type="range" min="3" max="13" step="0.1" value="13" disabled /></label>
    <output id="bin-label"></output>
    <label><input id="border" type="checkbox" checked disabled /> Black border (1 px)</label>
    <button id="export">Export PNG x2</button>
    <span id="status"></span>
  </div>
  <div id="chart-wrap"><figgy-chart id="chart"></figgy-chart></div>

  <script>
    if (location.protocol === "file:") {
      document.getElementById("status").textContent =
        "파일 직접 열기로는 실행할 수 없습니다. 저장소에서 npx serve crates/web -l 8142 실행 후 http://localhost:8142/ 를 여세요.";
    }
  </script>

  <script type="module">
    import { AxisPreset, ColorCycle, color_cycle_css } from "./figgy-chart.js?v=histogram";

    const status = document.getElementById("status");
    const chart = document.getElementById("chart");
    let binCount = 8192;
    let demoLabel = "";
    const bins = document.getElementById("bins");
    const border = document.getElementById("border");

    chart.addEventListener("figgy-select", (event) => {
      status.textContent = event.detail.selected ? "selected" : demoLabel;
    });
    chart.addEventListener("figgy-error", (event) => {
      const message = event.detail.error?.message ?? event.detail.error;
      status.textContent = `error: ${message}`;
    });

    const showSwatches = (name) => {
      document.getElementById("swatches").innerHTML = color_cycle_css(ColorCycle[name])
        .map((c) => `<span style="background:${c}"></span>`)
        .join("");
    };

    try {
      await chart.ready;

      let dataRegistered = false;
      const updateData = () => {
      binCount = Math.round(2 ** Number(bins.value));
      const edges = Float32Array.from({ length: binCount + 1 }, (_, i) => i * 8192 / binCount);
      const counts = Float32Array.from({ length: binCount }, (_, i) => {
        const x = (i + 0.5) / binCount;
        const height = 2 + 7 * Math.exp(-(((x - 0.3) / 0.13) ** 2))
          + 5 * Math.exp(-(((x - 0.72) / 0.09) ** 2));
        return height * [0.15, 1, 0.3, 0.45][i % 4];
      });
      if (dataRegistered) {
        chart.update_register_column_f32("histogram_edges", edges);
        chart.update_register_column_f32("histogram_counts", counts);
      } else {
        chart.register_column_f32("histogram_edges", edges);
        chart.register_column_f32("histogram_counts", counts);
        dataRegistered = true;
      }
      demoLabel = `${binCount.toLocaleString()} bins · baseline 0`;
      document.getElementById("bin-label").textContent = `${binCount.toLocaleString()} bins / width ${(8192 / binCount).toFixed(2)}`;
      status.textContent = demoLabel;
      };
      const updateSeries = () => {
      chart.set_series(JSON.stringify([{
        series_id: "subpixel_histogram", label: null,
        x_column: "histogram_edges", y_column: "histogram_counts",
        render_type: { Histogram: { bar: {
          fill_color: { r: 0.1, g: 0.6, b: 0.3, a: 0.65 },
          border_color: { r: 0, g: 0, b: 0, a: 1 },
          border_width: border.checked ? 1 : 0, baseline: 0, gap_px: 1, width_ratio: 1,
          orientation: "Vertical",
        } } },
      }]));
      };
      updateData();
      updateSeries();
      chart.set_title("Subpixel histogram: maximum per pixel column");
      chart.set_x_title("bin edge");
      chart.set_y_title("count");
      window.figgyKernel = chart.kernel;
      await chart.auto_fit_all(0.12);
      window.figgyChart = chart;
      status.textContent = demoLabel;
      bins.disabled = false;
      border.disabled = false;
      let pendingDemoFrame = 0;
      const updateDemo = () => {
        if (pendingDemoFrame) return;
        pendingDemoFrame = requestAnimationFrame(() => {
          pendingDemoFrame = 0;
          if (chart.busy) { updateDemo(); return; }
          try { updateData(); updateSeries(); }
          catch (error) { status.textContent = `update failed: ${error?.message ?? error}`; }
        });
      };
      bins.addEventListener("input", updateDemo);
      border.addEventListener("change", () => {
        if (chart.busy) { updateDemo(); return; }
        updateSeries();
      });

      document.getElementById("axis-preset").addEventListener("change", (event) => {
        chart.apply_axis_preset(AxisPreset[event.target.value]);
      });
      document.getElementById("color-cycle").addEventListener("change", (event) => {
        chart.apply_color_cycle(ColorCycle[event.target.value]);
        showSwatches(event.target.value);
      });
      showSwatches("Classic");

      const exportBtn = document.getElementById("export");
      exportBtn.addEventListener("click", async () => {
        if (chart.busy) return;
        exportBtn.disabled = true;
        try {
          const png = await chart.export_png(2.0);
          const url = URL.createObjectURL(new Blob([png], { type: "image/png" }));
          const a = Object.assign(document.createElement("a"), { href: url, download: "figgy.png" });
          a.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error("export:", error);
          status.textContent = `export failed: ${error?.message ?? error}`;
        } finally {
          exportBtn.disabled = false;
        }
      });
    } catch (error) {
      console.error("init:", error);
      status.textContent = `init failed: ${error?.message ?? error}`;
      throw error;
    }
  </script>
</body>
</html>
