name: Rust packages
# CI probe only (not for merge): compare the DXIL that DXC makes from the two
# shader sets' vector modules (#299).
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: rust-packages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  probe:
    name: windows-2025 / dxil diff probe
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile and compare
        run: python ci/probe-dxil/run.py
      - name: Upload the DXIL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dxil
          path: ${{ runner.temp }}/dxil/*.txt
          retention-days: 7
