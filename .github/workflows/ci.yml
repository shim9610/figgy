name: Rust packages
"on":
  pull_request:
    branches: [master]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: '1.99.0'
  PYTHONUTF8: '1'
jobs:
  metal-3d-pick:
    # Diagnostic only (#63): the 3D line ID pick on Metal.
    name: macos-15 / metal / 3d pick diagnostic
    runs-on: macos-15
    timeout-minutes: 120
    env:
      WGPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: The 3D line pick along four segments
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test surface_render a_diag -- --nocapture || echo "STEP FAILED"
      - name: The whole surface suite
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test surface_render -- --test-threads=1
