name: Rust packages
"on":
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: '1.99.0'
  PYTHONUTF8: '1'
jobs:
  metal-ternary:
    # Diagnostic only (#63): which ternary_render test leaves the Metal
    # device drawing nothing.
    name: macos-15 / metal / ternary diagnostic
    runs-on: macos-15
    timeout-minutes: 120
    env:
      WGPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build the ternary suite
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render --no-run
      - name: A ring of 131k, then the points, one process
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render -- --test-threads=1 --nocapture a_diag_1 points_land || echo "STEP FAILED"
      - name: 1024 rings of 1023, then the points, one process
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render -- --test-threads=1 --nocapture a_diag_2 points_land || echo "STEP FAILED"
      - name: One ring of a million, then the points, one process
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render -- --test-threads=1 --nocapture a_diag_3 points_land || echo "STEP FAILED"
