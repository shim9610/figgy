name: Rust packages
# CI probe only (not for merge): the DX12 stack overflow since #217.
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: rust-packages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '4'
  RUSTUP_TOOLCHAIN: '1.99.0'
  PYTHONUTF8: '1'
  WGPU_BACKEND: dx12
jobs:
  probe:
    name: windows-2025 / dx12 / stack probe
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install pinned Windows DXC and WARP
        run: python ci/setup_windows.py
      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: packages-dx12
          save-if: false
      - name: Probe the contour label test's overflow
        shell: bash
        run: |
          set +e
          export CARGO_TARGET_DIR="$(pwd -W)/target"
          T=contour_label_gaps_pick_and_highlight_nothing
          run() {
            label=$1; shift
            cargo test --locked -p figgy-renderer --features serde,cpu-twin --test pick_draw_agreement --no-run || exit 1
            python -c "import glob, os, shutil; [shutil.copy(f, os.path.join(os.environ['CARGO_TARGET_DIR'], 'debug', 'deps')) for f in glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'figgy-dx12', '*.dll'))]"
            for n in 1; do
              timeout 300 cargo test --locked -p figgy-renderer --features serde,cpu-twin --test pick_draw_agreement $T -- --exact --nocapture --test-threads=1 > t.log 2>&1
              echo "RESULT $label run $n exit=$?"
              grep -E "overflowed|test result|panicked" t.log | head -3; tail -2 t.log
            done
          }
          for mb in 2 4 8; do
            export RUSTFLAGS="-C link-arg=/STACK:$((mb * 1048576))"
            run stack${mb}m
          done
