name: Rust packages
"on":
  pull_request:
    branches: [master]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: '1.99.0'
  PYTHONUTF8: '1'
jobs:
  metal-ternary:
    # Diagnostic only (#63): the ring-start scan on Metal.
    name: macos-15 / metal / ring scan check
    runs-on: macos-15
    timeout-minutes: 120
    env:
      WGPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: The ternary suite in one process, the million-vertex ring first
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render -- --test-threads=1 --nocapture
      - name: The ring-start scan against the CPU rule
        run: cargo test --locked -p figgy-renderer --lib ternary_region -- --nocapture
