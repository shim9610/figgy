name: Rust packages
# CI probe only (not for merge): how the vector scenes differ between the
# basic and the full shaders on DX12 (#299): the 3D vector field at 2x.
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: rust-packages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '4'
  RUSTUP_TOOLCHAIN: '1.99.0'
  PYTHONUTF8: '1'
jobs:
  probe:
    name: ${{ matrix.os }} / ${{ matrix.backend }} / shader set probe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            backend: dx12
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install pinned Windows DXC and WARP
        if: runner.os == 'Windows'
        run: python ci/setup_windows.py
      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: packages-${{ matrix.backend }}
          save-if: false
      - name: The shader set scenes
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then export CARGO_TARGET_DIR="$(pwd -W)/target"; else export CARGO_TARGET_DIR="$(pwd)/target"; fi
          cargo test --locked -p figgy-renderer --features serde --test shader_set_scenes --no-run > build.log 2>&1 || { tail -30 build.log; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import glob, os, shutil; [shutil.copy(f, os.path.join(os.environ['CARGO_TARGET_DIR'], 'debug', 'deps')) for f in glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'figgy-dx12', '*.dll'))]"
          fi
          cargo test --locked -p figgy-renderer --features serde --test shader_set_scenes the_last_third -- --nocapture --test-threads=1 > t.log 2>&1
          echo "RESULT exit=$?"
          grep -E "differ between|test result|panicked" t.log
          ls -la target/tmp/shader-set-differences 2>/dev/null
          exit 0
      - name: Upload the differing exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shader-set-differences-${{ matrix.os }}-${{ matrix.backend }}
          path: target/tmp/shader-set-differences/
          retention-days: 7
          if-no-files-found: warn
