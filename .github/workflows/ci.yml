name: Rust packages
"on":
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: '1.99.0'
  PYTHONUTF8: '1'
jobs:
  metal-ternary:
    # Diagnostic only (#63): which ternary_render test leaves the Metal
    # device drawing nothing.
    name: macos-15 / metal / ternary diagnostic
    runs-on: macos-15
    timeout-minutes: 120
    env:
      WGPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build the ternary suite
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render --no-run
      - name: Every test but the million-vertex region, in one process
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render -- --test-threads=1 --skip a_million_vertex_region || echo "STEP FAILED"
      - name: The million-vertex region alone
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render a_million_vertex_region -- --exact --nocapture || echo "STEP FAILED"
      - name: Points alone, a fresh process
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render points_land_at_their_normalized_position -- --exact --nocapture || echo "STEP FAILED"
      - name: The region tests without the million, in one process
        run: cargo test --locked -p figgy-renderer --features serde,cpu-twin --test ternary_render region -- --test-threads=1 --skip a_million_vertex_region || echo "STEP FAILED"
