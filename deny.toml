# cargo-deny policy for the workspace (#160). CI runs `cargo deny check` in the
# repository job; run it locally with `cargo deny --all-features check`.

[graph]
all-features = true

[advisories]
version = 2
# Every RustSec vulnerability fails the check. Unmaintained notices fail for
# direct dependencies only, so a transitive notice is reported by Dependabot
# instead of blocking unrelated work.
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
# The licenses the current dependency graph uses; a new one needs review.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions come from the wgpu, winit and egui graphs and are not
# ours to resolve; they are reported, not denied.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
